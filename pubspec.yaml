name: nexus
description: "A new Flutter project."
publish_to: 'none'
version: 1.8.0+35

environment:
  sdk: ^3.12.2

dependencies:
  # El contrato del canal teléfono ↔ Mac. Por ruta y no publicado: lo comparten el
  # servidor que vive aquí y el cliente móvil, y un contrato publicado tendría que
  # versionarse aparte para nada — los dos lados salen de este repositorio.
  nexus_protocol:
    path: packages/nexus_protocol
  crypto: ^3.0.7
  # 0.8 trae un cambio ruptura, y **es de Android**: exige Android Gradle Plugin
  # 9 o superior. Se subió porque este proyecto ya va por delante —AGP 9.0.1 y
  # Kotlin 2.3.20 en `android/settings.gradle.kts`—, no porque el aviso pareciera
  # inofensivo. Si algún día hay que bajar el AGP, esto vuelve a 0.7.
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  hotkey_manager: ^0.2.3
  # Directa y no transitiva a propósito: `MarkdownElementBuilder.visitText`
  # recibe un `md.Text`, así que pintar los bloques de código a mano obliga a
  # nombrar el tipo. Usarla sin declararla es lo que el linter llama depender de
  # algo que no pediste — y el día que `flutter_markdown_plus` deje de traerla,
  # esto se rompe sin que nadie haya tocado nada.
  markdown: ^7.3.1
  # El resaltado de los bloques de código. Solo la gramática: los colores no
  # salen de un tema enlatado suyo, sino de la paleta de Nexus — ver
  # [ElResaltadoDelCodigo]. Un tema importado no conoce el claro/oscuro ni el
  # acento configurable, así que pegaría en una mitad de los casos.
  highlight: ^0.7.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  webview_flutter: ^4.14.1
  record: ^7.1.1
  flutter_pcm_sound: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Reloj de mentira para las pruebas: b11 va de plazos de 6 y 20 segundos, y
  # esperarlos de verdad haría una suite que nadie corre. Ya venía de transitiva
  # con flutter_test; se declara porque se usa directamente.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
