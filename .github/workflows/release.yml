# Sacar una versión desde GitHub: compilar, firmar, notarizar y publicar.
#
# El primer CI de este repo murió justo aquí —«No signing certificate Developer ID
# Application found»— porque un runner no tiene el certificado. Esto lo arregla, y
# el precio hay que decirlo: **la clave privada de firma vive en los secretos del
# repositorio**. El repo es público, así que un cambio descuidado en un workflow es
# una exposición real; de ahí que esto solo se dispare con una etiqueta, que solo
# puede empujar quien tenga escritura.
#
# Secretos que hace falta crear (una vez):
#
#   MACOS_CERT_P12        el certificado + su clave privada, exportado y en base64
#   MACOS_CERT_PASSWORD   la contraseña con la que se exportó ese .p12
#   NOTARY_API_KEY_P8     la clave .p8 de App Store Connect, en base64
#   NOTARY_KEY_ID         el Key ID de esa clave
#   NOTARY_ISSUER_ID      el Issuer ID de tu cuenta (UUID)
#
# Se eligió clave de API y no Apple ID + contraseña de aplicación a propósito: se
# revoca una sola clave sin tocar la cuenta, y no hay contraseña personal en juego.
name: Release

# El disparador es **mezclar en master**, y no una etiqueta empujada a mano.
#
# Antes lo era la etiqueta, y eso se olvida: con la 0.0.3 la PR se mezcló, el
# `pubspec` decía 0.0.3 y **no había release**, porque nadie había empujado
# `v0.0.3`. Un paso manual entre «está aprobado» y «está publicado» es un paso que
# algún día no se da. La etiqueta la pone este workflow, que ya sabe qué versión
# es porque la lee del `pubspec`.
on:
  push:
    branches: [master]
    # Se conserva la etiqueta como disparador: sirve para publicar algo antiguo
    # sin tocar master.
    tags: ['v*']
  # Y para reintentar una versión que falló a mitad.
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 0.0.2)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Barato y aparte: decidir si hay algo que hacer no necesita un runner de macOS,
  # y **casi siempre la respuesta es que no**. Cualquier commit en master dispara
  # esto, y solo los que traen una versión nueva llegan a compilar.
  decidir:
    name: ¿hay algo que publicar?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.puerta.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - name: de dónde sale la versión
        id: v
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            # Del pubspec, que es la fuente de verdad de lo que hay dentro del
            # paquete. Al revés —etiqueta primero— es como se llega a publicar una
            # versión que no coincide con la que la app dice de sí misma.
            V="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versión: $V"

      - name: ¿ya está publicada?
        id: puerta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # A mano es el camino de reintentar: aquí no se pregunta nada.
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$V" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::la v$V ya está publicada; no hay nada que hacer"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    name: compilar, firmar, notarizar y publicar
    needs: decidir
    if: needs.decidir.outputs.publicar == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El histórico completo: hace falta para comprobar que esto sale de
          # master, para las notas del appcast, y un clon superficial no puede
          # responder a ninguna de las dos.
          fetch-depth: 0

      # Las mismas negativas que el guion local, y por los mismos motivos: una
      # etiqueta que no corresponde a lo que hay dentro del paquete deja al
      # actualizador comparando contra otra cosa.
      - name: comprobar que la versión coincide con el pubspec
        run: |
          EN_PUBSPEC="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          if [[ "$EN_PUBSPEC" != "${{ needs.decidir.outputs.version }}" ]]; then
            echo "::error::pubspec dice $EN_PUBSPEC y se está publicando ${{ needs.decidir.outputs.version }}"
            exit 1
          fi

      - name: comprobar que esto está en master
        run: |
          git fetch -q origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::este commit no está en master, y las releases salen de master"
            exit 1
          fi

      # La etiqueta, antes de construir, para que apunte a lo que se construye.
      #
      # Nota de por qué esto no se muerde la cola: una etiqueta empujada con el
      # `GITHUB_TOKEN` **no dispara workflows**. Aquí eso es justo lo que hace
      # falta —si los disparara, esta misma release se lanzaría dos veces—.
      - name: etiquetar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.decidir.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "la etiqueta v$V ya existe"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$V" -m "Nexus $V"
            git push origin "v$V"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # El llavero es temporal y de este trabajo: así la clave no se queda en el
      # runner ni se mezcla con el llavero de login.
      - name: montar el certificado de firma
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          CLAVE_P12: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [[ -n "$P12" ]] || { echo "::error::falta el secreto MACOS_CERT_P12"; exit 1; }
          LLAVERO="$RUNNER_TEMP/firma.keychain-db"
          CLAVE_LLAVERO="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          security set-keychain-settings -lut 900 "$LLAVERO"
          security unlock-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          security import "$RUNNER_TEMP/cert.p12" -k "$LLAVERO" \
            -P "$CLAVE_P12" -T /usr/bin/codesign -T /usr/bin/security
          # Sin esto, codesign se queda esperando una autorización que nadie va a
          # dar: en un runner no hay quien pulse «Permitir».
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$CLAVE_LLAVERO" "$LLAVERO" >/dev/null
          security list-keychains -d user -s "$LLAVERO" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          security find-identity -v -p codesigning "$LLAVERO" | grep "Developer ID Application" \
            || { echo "::error::el .p12 no traía un Developer ID Application"; exit 1; }

      - name: compilar en Release
        run: flutter build macos --release

      # Los dos filtros que costaron un rechazo de Apple: sin hardened runtime, y
      # sobre todo sin **sello de tiempo seguro** —`Signed Time` es local y no
      # cuenta—, el envío se rechaza. Verlo aquí cuesta un segundo; verlo en Apple,
      # varios minutos.
      - name: comprobar la firma antes de enviarla
        run: |
          APP="build/macos/Build/Products/Release/Nexus.app"
          codesign --verify --deep --strict "$APP"
          DATOS="$(codesign -dvvv "$APP" 2>&1 || true)"
          case "$DATOS" in
            *'flags=0x10000(runtime)'*) ;;
            *) echo "::error::falta hardened runtime"; exit 1 ;;
          esac
          case "$DATOS" in
            *'Timestamp='*) ;;
            *) echo "::error::la firma no lleva sello de tiempo seguro"; exit 1 ;;
          esac

      # `ditto` y no `zip`: preserva los enlaces de los frameworks; con `zip` la
      # firma se rompe al descomprimir. Comprobado en local.
      - name: empaquetar
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/Nexus.app" \
            "build/Nexus-${{ needs.decidir.outputs.version }}.zip"

      - name: notarizar y sellar
        env:
          P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          [[ -n "$P8" ]] || { echo "::error::falta el secreto NOTARY_API_KEY_P8"; exit 1; }
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/clave.p8"
          ZIP="build/Nexus-${{ needs.decidir.outputs.version }}.zip"
          APP="build/macos/Build/Products/Release/Nexus.app"

          # Se mira **el veredicto**, no el código de salida: `--wait` devuelve 0
          # en cuanto termina de esperar, aunque Apple haya dicho `Invalid`. Sin
          # esto se sigue adelante a sellar un ticket que no existe, y el error que
          # se lee es «Record not found» — un síntoma tres pasos más allá.
          set +e
          ENVIO="$(xcrun notarytool submit "$ZIP" \
            --key "$RUNNER_TEMP/clave.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait 2>&1)"
          set -e
          echo "$ENVIO"
          ID="$(printf '%s' "$ENVIO" | awk '/^  id: /{print $2; exit}')"

          case "$ENVIO" in
            *'status: Accepted'*) ;;
            *)
              echo "::error::Apple no la aceptó"
              xcrun notarytool log "$ID" \
                --key "$RUNNER_TEMP/clave.p8" --key-id "$KEY_ID" --issuer "$ISSUER" || true
              exit 1
              ;;
          esac

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          spctl -a -vv -t install "$APP"
          rm -f "$RUNNER_TEMP/clave.p8"

      # El DMG se arma **después** de sellar la app, y no antes: si se armara
      # primero llevaría dentro una copia sin ticket, y quien la arrastrase a
      # Aplicaciones tendría una app que necesita red para abrirse la primera vez.
      #
      # Y va firmado y notarizado él también. Un DMG sin firmar da el aviso de
      # «no se pudo verificar» al montarlo, aunque la app de dentro esté impecable:
      # lo primero que ve quien descarga es el disco, no la app.
      - name: armar, firmar y notarizar el DMG
        env:
          P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          V="${{ needs.decidir.outputs.version }}"
          APP="build/macos/Build/Products/Release/Nexus.app"
          DMG="build/Nexus-$V.dmg"
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/clave.p8"

          tool/dmg.sh "$APP" "$DMG" "$V"

          IDENTIDAD="$(security find-identity -v -p codesigning \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          codesign --sign "$IDENTIDAD" --timestamp --force "$DMG"
          codesign --verify --strict "$DMG"

          set +e
          ENVIO="$(xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/clave.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait 2>&1)"
          set -e
          echo "$ENVIO"
          ID="$(printf '%s' "$ENVIO" | awk '/^  id: /{print $2; exit}')"
          case "$ENVIO" in
            *'status: Accepted'*) ;;
            *)
              echo "::error::Apple no aceptó el DMG"
              xcrun notarytool log "$ID" \
                --key "$RUNNER_TEMP/clave.p8" --key-id "$KEY_ID" --issuer "$ISSUER" || true
              exit 1
              ;;
          esac

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          rm -f "$RUNNER_TEMP/clave.p8"

      # El feed que lee la app instalada. Sin esto el actualizador no encuentra
      # nada nunca: no hay «no hay novedades», hay un feed que no existe.
      #
      # La firma EdDSA es una segunda cerradura sobre la de Apple. La pública va
      # dentro de la app (`SUPublicEDKey` en el Info.plist) y la privada solo aquí:
      # aunque alguien lograra colgar un zip en las releases de este repo público,
      # sin esta firma Sparkle lo rechaza antes de descomprimirlo.
      - name: armar el appcast y firmarlo
        env:
          CLAVE: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -o pipefail
          [[ -n "$CLAVE" ]] || { echo "::error::falta el secreto SPARKLE_PRIVATE_KEY"; exit 1; }
          V="${{ needs.decidir.outputs.version }}"
          ZIP="build/Nexus-$V.zip"
          APP="build/macos/Build/Products/Release/Nexus.app"

          # `sparkle:version` es el **build**, no la versión visible: es el número
          # que Sparkle compara, y tiene que crecer siempre. Se lee del paquete ya
          # construido y no del pubspec, para que sea el mismo que la app dirá de
          # sí misma.
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"

          # Por archivo y no con `-s`: pasar la clave como argumento **ya no está
          # soportado** —«Specifying private key as an argument is no longer
          # supported»— y eso tumbó la primera 0.0.3. El fallo se colό porque el
          # guion local no usa esta rama: allí la clave sale del llavero, así que
          # el camino de CI nunca se había ejecutado.
          # Sin salto final: un secreto guardado con un `\n` al final haría que
          # la clave no se reconociera, y el error saldría igual de tarde.
          printf '%s' "$CLAVE" | tr -d '\r\n' > "$RUNNER_TEMP/sparkle.key"
          FIRMA="$(macos/Pods/Sparkle/bin/sign_update "$ZIP" --ed-key-file "$RUNNER_TEMP/sparkle.key")"
          rm -f "$RUNNER_TEMP/sparkle.key"
          [[ "$FIRMA" == *edSignature* ]] || { echo "::error::sign_update no devolvió una firma"; exit 1; }

          # Qué trae: los asuntos de los commits desde la etiqueta anterior. Van
          # en inglés porque así se escriben en este repo; es la fuente de verdad
          # de lo que cambió, y preferimos eso a un texto escrito a mano que
          # envejece.
          ANTERIOR="$(git describe --tags --abbrev=0 "v$V^" 2>/dev/null || true)"
          if [[ -n "$ANTERIOR" ]]; then
            NOTAS="$(git log --no-merges --pretty='- %s' "$ANTERIOR..v$V")"
          else
            NOTAS="- first published version"
          fi

          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo '    <title>Nexus</title>'
            echo '    <item>'
            echo "      <title>$V</title>"
            echo "      <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>"
            echo '      <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>'
            echo '      <description><![CDATA['
            echo "$NOTAS"
            echo '      ]]></description>'
            echo "      <enclosure url=\"https://github.com/${{ github.repository }}/releases/download/v$V/Nexus-$V.zip\""
            echo "                 sparkle:version=\"$BUILD\""
            echo "                 sparkle:shortVersionString=\"$V\""
            echo '                 type="application/octet-stream"'
            echo "                 $FIRMA />"
            echo '    </item>'
            echo '  </channel>'
            echo '</rss>'
          } > build/appcast.xml

          xmllint --noout build/appcast.xml \
            || { echo "::error::el appcast no es XML válido"; exit 1; }

      # Se publican **los dos**, y cada uno tiene su trabajo:
      #
      #   .dmg          la primera instalación, para personas: arrastrar a Aplicaciones.
      #   .zip          las actualizaciones, para Sparkle: es el formato que consume.
      #   appcast.xml   el feed que dice que existe esa actualización.
      #
      # El zip no es un resto del pasado; es lo que hace posible que la app se
      # actualice sola. Y el appcast tiene que llamarse **igual siempre**: la app
      # lo pide por `releases/latest/download/appcast.xml`, una dirección que no
      # caduca porque GitHub la redirige a la última release.
      - name: publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.decidir.outputs.version }}"
          ASSETS=("build/Nexus-$V.dmg" "build/Nexus-$V.zip" "build/appcast.xml")
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "${ASSETS[@]}" --clobber
          else
            gh release create "v$V" "${ASSETS[@]}" --title "Nexus $V" --generate-notes
          fi

      # Siempre: si algo falló a mitad, la clave no se queda en el runner.
      - name: retirar el llavero
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/firma.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/clave.p8" || true

  # La mezcla de vuelta, que es la mitad de Gitflow que siempre se olvida.
  #
  # Historia de por qué existe, porque justifica el trabajo entero: las dos
  # primeras releases se mezclaron aplastadas y nadie devolvió master a develop.
  # Resultado: `merge-base(master, develop)` se quedó en **«Initial commit»**, las
  # dos ramas quedaron como árboles sin parentesco, y la siguiente release
  # conflictuó con **18 archivos** por un desvío que era **una línea** —el número
  # de versión—. Se arregló a mano dos veces el mismo día. La tercera, no.
  #
  # Va después de publicar y no antes: si la release falla, develop no debe
  # quedarse con un número de versión que no llegó a existir.
  enlazar:
    name: devolver master a develop
    needs: [decidir, publicar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: mezclar master en develop
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.decidir.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin master

          if git merge-base --is-ancestor origin/master HEAD; then
            echo "::notice::develop ya contiene master; nada que devolver"
            exit 0
          fi

          # `--no-ff` siempre: el commit de mezcla **es** el enlace entre las dos
          # historias. Un avance rápido no dejaría constancia de que se tocaron,
          # que es exactamente lo que se perdió con los squash.
          CUERPO="Gitflow's other half, done by the release itself. Without it master and develop drift apart on the version number and the next release conflicts against a base that shares less and less."
          if git merge --no-ff -m "chore: bring $V back from master into develop" -m "$CUERPO" origin/master; then
            git push origin HEAD:develop
            echo "::notice::master devuelto a develop"
          else
            # Un conflicto aquí quiere decir que develop cambió algo que la release
            # también cambió, y eso lo resuelve una persona. Se abre una PR en vez
            # de fallar en silencio: un trabajo rojo se mira, pero un trabajo rojo
            # del que nadie se enteró es cómo se llega otra vez a dos historias sin
            # parentesco.
            git merge --abort
            RAMA="chore/devolver-$V-a-develop"
            git checkout -b "$RAMA"
            git push -q origin "$RAMA"
            gh pr create --base develop --head "$RAMA" \
              --title "chore: bring $V back from master into develop (needs hands)" \
              --body "La mezcla de vuelta automática encontró conflictos y la deja aquí. **Mézclala con «Create a merge commit»**: el commit de mezcla es lo que enlaza las dos historias, y un squash devuelve el problema que esto viene a evitar." || true
            echo "::warning::la vuelta tiene conflictos; queda una PR abierta"
            exit 1
          fi
