# Lo que nadie corría salvo a mano.
#
# Hay 1.356 pruebas de Dart, 37 del protocolo y 45 nativas, y hasta ahora
# dependían de que quien mezclara se acordara de ejecutarlas. Aguanta por
# disciplina y deja de aguantar el primer día con prisa — y son justo las que
# pillan lo que el análisis estático no ve: una fila que desborda, un velo
# colapsado a tamaño cero.
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Un empujón nuevo cancela el anterior de la misma rama: en una rama que se
# empuja tres veces seguidas, las dos primeras corridas ya no interesan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El grueso, y en Linux a propósito: las pruebas de Dart no necesitan un Mac y
  # los minutos de macOS cuestan diez veces más.
  dart:
    name: análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Clavada, no "stable": la suite depende de detalles del harness de
          # pruebas —cómo mide texto la fuente de prueba, cómo se comporta
          # `pumpScreen`— y un salto de versión rompería cosas que no cambió
          # nadie. Se sube a mano y se ve el fallo en su propio PR.
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # Las del paquete del protocolo van **antes** del análisis, y ese orden es el
      # arreglo de un fallo real: `flutter analyze` desde la raíz analiza también
      # `packages/`, así que con las dependencias del paquete sin resolver daba
      # **98 errores** de imports que no existen.
      #
      # No se vio en local porque allí ya se había hecho `dart pub get` en el
      # paquete a mano: la comprobación local estaba contaminada con un estado que
      # el runner no tiene. Es el mismo error que con `sign_update`, verificar un
      # camino cuyas condiciones no son las del camino real.
      - name: resolver el paquete del protocolo
        working-directory: packages/nexus_protocol
        run: dart pub get

      # Uno solo desde la raíz: cubre la app y el paquete, y así los dos obedecen
      # las mismas reglas sin tener que repetirlas.
      #
      # `--fatal-infos` porque si no, la mitad de lo que dicen los modos estrictos
      # no para nada: `strict-raw-types` avisa con severidad *info*, y un aviso que
      # no rompe el CI es un aviso que se acumula. Hoy el análisis sale en cero, así
      # que exigirlo no cuesta nada — y ese es justo el momento de exigirlo.
      - name: flutter analyze
        run: flutter analyze --fatal-infos

      # Y el formato, por el mismo motivo que `--fatal-infos`: 55 archivos
      # habían quedado sin formatear, y el precio no era la estética — era que
      # cada rama que tocara uno arrastraba cien líneas de reindentado ajeno al
      # cambio. Tres veces hubo que revertirlo a mano para que un PR de
      # seguridad se pudiera leer.
      #
      # `--output=none` no toca nada: solo dice si algo está sin formatear.
      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test packages

      # Y sus pruebas, que `flutter test` **no mira**: es Dart puro con su propio
      # `pubspec`. Sin este paso sus 37 pruebas existirían y no las correría nadie,
      # que es el problema que este workflow vino a resolver. Una de ellas compara
      # el código con `docs/PROTOCOL.md`: si se queda sin ejecutar, el documento y
      # el contrato pueden separarse en silencio.
      - name: pruebas del protocolo
        working-directory: packages/nexus_protocol
        run: dart test

      - name: flutter test
        run: flutter test --coverage

      # El número, dicho en voz alta.
      #
      # Sin servicio de terceros y sin mandar nada fuera: se suma el `lcov` que
      # `--coverage` acaba de escribir y se pone en el resumen del job. No hay
      # umbral que rompa la corrida a propósito — poner uno hoy, sin haber mirado
      # qué está sin cubrir, sería elegir un número al azar y luego trabajar para
      # el número. Lo que hace falta primero es verlo moverse.
      - name: cobertura
        run: |
          awk -F: '/^LF:/ {t+=$2} /^LH:/ {c+=$2} END {
            printf "Cobertura de líneas: **%.1f %%** — %d de %d\n", 100*c/t, c, t
          }' coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

  # Aparte porque pide macOS: es el único sitio donde se pueden correr, y no hay
  # motivo para pagar un Mac por el análisis.
  #
  # Nacieron por la caída del visor —cerrar una ventana mataba la app entera y
  # las de Dart no podían verlo, porque el fallo vive en AppKit—. Ahora cubren
  # además qué puede hacer un documento dentro de esa ventana, la aserción de
  # energía que si se escapa deja el Mac sin dormirse, la miniatura que nunca
  # puede salir vacía, y la única decisión del motor de audio que no necesita
  # hardware.
  nativas:
    name: pruebas nativas de macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # `--config-only`: genera la configuración efímera de macOS —sin ella
      # Xcode no encuentra `Generated.xcconfig`— pero **no construye**. Construir
      # aquí con `flutter build` falló en la primera corrida de este workflow: el
      # proyecto está firmado con «Developer ID Application» y un runner no tiene
      # ese certificado. Quien construye es el `xcodebuild` de abajo, que sí puede
      # hacerlo sin firmar.
      - name: preparar el proyecto sin construirlo
        run: flutter build macos --debug --config-only

      # Sin firma: aquí no se distribuye nada, solo se corren pruebas. Con la
      # firma puesta, el runner busca un certificado del equipo Y9H7TRB5L7 que no
      # existe y el build muere antes de compilar una línea.
      - name: xcodebuild test
        working-directory: macos
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=macOS' \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -40
